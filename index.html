<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>困りごと発明所</title>
<style>
:root{--ink:#20332d;--muted:#65746d;--green:#245c48;--lime:#d9ed91;--paper:#f7f5ef;--card:#fffefa;--line:#dce2d8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}
.wrap{width:min(800px,calc(100% - 36px));margin:auto}
header{padding:24px 0;font-weight:850}.brand span{color:var(--green)}
.hero{padding:44px 0 48px}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;color:var(--green)}
h1{font-size:clamp(2.5rem,8vw,4rem);line-height:1.17;letter-spacing:-.05em;margin:14px 0}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--lime) 62%)}
p{color:var(--muted)}
.button{display:inline-block;border:0;border-radius:999px;padding:13px 22px;background:var(--green);color:white;text-decoration:none;font:inherit;font-weight:750;cursor:pointer}
.panel,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
form{display:grid;gap:18px}
label{font-weight:750;display:block;margin-bottom:7px}
.hint{font-size:.84rem;margin:3px 0 8px}
input,textarea{font:inherit;width:100%;padding:12px 14px;border:1px solid #cbd5ca;border-radius:10px;background:#fffefa;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid #cbd5ca;border-radius:999px;padding:7px 12px;background:white;cursor:pointer;font:inherit}
.choice[aria-pressed=true]{background:var(--green);color:white}
.checkline{display:flex;gap:10px;align-items:start;font-size:.9rem;color:var(--muted)}
.checkline input{width:auto;margin-top:6px}
.notice{font-size:.82rem;background:#f0f2e9;padding:12px;border-radius:10px}
.result-wrap{display:none;margin-top:20px}.result-wrap.visible{display:block}
.badge{font-size:.75rem;font-weight:800;background:#fff0d8;color:#8a5518;padding:5px 10px;border-radius:999px}
.idea{background:#eef3df;border-radius:12px;padding:15px;margin-top:15px}
.result h3{font-size:1.35rem}.result h4{margin:18px 0 5px}
footer{padding:28px 0;color:var(--muted);font-size:.85rem}
@media(max-width:600px){.hero{padding-top:24px}.panel,.result{padding:17px}}
</style>
</head>
<body>
<header class="wrap"><div class="brand">困りごと<span>発明所</span></div></header>
<main class="wrap">
<section class="hero">
<div class="eyebrow">あなたの声から、暮らしのアイデアへ</div>
<h1>その「ちょっと不便」が、<br><em>次の発明</em>になる。</h1>
<p>毎日の小さな困りごとを教えてください。解決のヒントを一緒に考えます。</p>
</section>
<section class="panel">
<h2>最近の「困った」を教えてください</h2>
<p class="hint">具体的な場面がわかるほど、アイデアが生まれやすくなります。個人情報は書かないでください。</p>
<form id="form">
<div><label for="title">困りごとをひとことで *</label><input id="title" required maxlength="70" placeholder="例：雨の日、ぬれた傘の置き場所に困る"></div>
<div><label for="scene">どんなときに困りますか？ *</label><textarea id="scene" required maxlength="500" placeholder="いつ、どこで、何が起きるかを教えてください"></textarea></div>
<div><label>どのくらいの頻度ですか？ *</label><div class="choices" data-key="frequency"><button type="button" class="choice">毎日</button><button type="button" class="choice">週に数回</button><button type="button" class="choice">月に数回</button><button type="button" class="choice">たまに</button></div></div>
<div><label>困り度はどのくらい？ *</label><div class="choices" data-key="severity"><button type="button" class="choice">1 ちょっと気になる</button><button type="button" class="choice">2 面倒</button><button type="button" class="choice">3 かなり困る</button><button type="button" class="choice">4 ほぼ毎回ストレス</button></div></div>
<div><label for="attempt">今はどうしていますか？（任意）</label><textarea id="attempt" maxlength="300" placeholder="例：とりあえず床に置いている"></textarea></div>
<label class="checkline"><input id="consent" type="checkbox" required><span>投稿内容を匿名のアイデア整理に使うことに同意します。個人情報は書かないでください。</span></label>
<button class="button" type="submit">困りごとを整理する</button>
<div class="notice">この試作品はAIに接続していません。入力内容は保存・送信されず、この画面上で模擬結果を表示します。</div>
</form>
<div class="result-wrap" id="result" aria-live="polite">
<div class="result"><span class="badge">模擬結果・AI未接続</span><h3 id="r-title"></h3>
<h4>困りごとの要約</h4><p id="r-summary"></p>
<div class="idea"><h4>解決アイデアのたたき台</h4><p id="r-idea"></p></div>
<h4>次に聞いてみたいこと</h4><p>この困りごとは直近1週間で何回起きましたか？今の対処で変えたい点はどこですか？</p>
</div></div>
</section>
</main>
<footer class="wrap">困りごと発明所｜試作品</footer>
<script>
const selected={frequency:"",severity:""};
document.querySelectorAll(".choices").forEach(group=>group.addEventListener("click",e=>{
 const button=e.target.closest(".choice");if(!button)return;
 group.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-pressed","false"));
 button.setAttribute("aria-pressed","true");selected[group.dataset.key]=button.textContent.trim();
}));
document.querySelector("#form").addEventListener("submit",e=>{
 e.preventDefault();
 if(!selected.frequency||!selected.severity){alert("頻度と困り度を選んでください");return}
 const title=document.querySelector("#title").value.trim();
 const scene=document.querySelector("#scene").value.trim();
 const attempt=document.querySelector("#attempt").value.trim();
 document.querySelector("#r-title").textContent=title;
 document.querySelector("#r-summary").textContent=scene+"（頻度："+selected.frequency+"、困り度："+selected.severity+"）"+(attempt?" 現在は「"+attempt+"」と対処しています。":"");
 document.querySelector("#r-idea").textContent="まずは「"+title+"」が起きる場面で、家にあるものや手順の工夫だけで1週間試せる方法を考えてみましょう。これはAIが生成した回答ではなく、模擬提案です。";
 document.querySelector("#result").classList.add("visible");
 document.querySelector("#result").scrollIntoView({behavior:"smooth",block:"center"});
});
</script>
</body>
</html>
